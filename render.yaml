envVarGroups:
  - name: onflows-preview-shared
    envVars:
      - key: ONFLOWS_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: onflows-api-preview
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    runtime: python
    branch: codex/build-end-to-end-cloud-integration
    buildFilter:
      paths:
        - apps/api/**
        - biathlon/**
        - hrmod_lab/**
        - intervals_inspector/**
        - vflat_b65/**
        - requirements-api.txt
        - render.yaml
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - fromGroup: onflows-preview-shared
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: INTERVALS_CLIENT_ID
        sync: false
      - key: INTERVALS_CLIENT_SECRET
        sync: false
      - key: INTERVALS_REDIRECT_URI
        value: https://onflows-api-preview.onrender.com/api/v2/integrations/intervals/callback
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ONFLOWS_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ONFLOWS_ATHLETE_ALIAS
        sync: false
      - key: ONFLOWS_HR_ZONE_BOUNDS
        sync: false
      - key: ONFLOWS_ATHLETE_TIMEZONE
        sync: false
      - key: ONFLOWS_INTRAZONE_VERSION
        value: intra_zone_linear_v1
      - key: ONFLOWS_TREF_VERSION
        value: tref-bounded-40d-expert-v1
      - key: ONFLOWS_RECOVERY_VERSION
        sync: false
      - key: ONFLOWS_HISTORY_DAYS
        value: "90"
      - key: ONFLOWS_SNAPSHOT_SALT
        generateValue: true
      - key: ONFLOWS_ACTIVITY_ID_SECRET
        generateValue: true
      - key: ONFLOWS_WEB_BASE_URL
        value: https://onflows-web-preview.onrender.com
  - type: worker
    name: onflows-sync-worker-preview
    plan: starter
    region: frankfurt
    autoDeployTrigger: checksPass
    runtime: python
    branch: codex/build-end-to-end-cloud-integration
    numInstances: 1
    maxShutdownDelaySeconds: 300
    buildFilter:
      paths:
        - apps/api/**
        - biathlon/**
        - hrmod_lab/**
        - intervals_inspector/**
        - vflat_b65/**
        - requirements-api.txt
        - render.yaml
    buildCommand: pip install -r requirements-api.txt
    startCommand: python -m apps.api.sync_worker --lease-seconds 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # These values must match the existing API service exactly. In
      # particular, never regenerate the encryption, salt or activity-ID keys.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ONFLOWS_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ONFLOWS_INTRAZONE_VERSION
        value: intra_zone_linear_v1
      - key: ONFLOWS_TREF_VERSION
        value: tref-bounded-40d-expert-v1
      - key: ONFLOWS_RECOVERY_VERSION
        sync: false
      - key: ONFLOWS_HISTORY_DAYS
        value: "90"
      - key: ONFLOWS_SNAPSHOT_SALT
        sync: false
      - key: ONFLOWS_ACTIVITY_ID_SECRET
        sync: false
  - type: web
    name: onflows-web-preview
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    runtime: node
    branch: codex/build-end-to-end-cloud-integration
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - fromGroup: onflows-preview-shared
      - key: NODE_VERSION
        value: 22.14.0
      - key: ONFLOWS_DATA_MODE
        value: api
      - key: ONFLOWS_API_RESOURCE
        value: real
      - key: ONFLOWS_API_BASE_URL
        sync: false
      - key: ONFLOWS_PROFILE_MODE
        value: multi
      - key: ONFLOWS_SESSION_SECRET
        generateValue: true
