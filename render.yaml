services:
  - type: web
    name: onflows-api-preview
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    runtime: python
    branch: codex/build-end-to-end-cloud-integration
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ONFLOWS_SERVICE_TOKEN
        sync: false
      - key: INTERVALS_ACCESS_TOKEN
        sync: false
      - key: INTERVALS_ATHLETE_ID
        sync: false
      - key: ONFLOWS_ATHLETE_ALIAS
        sync: false
      - key: ONFLOWS_HR_ZONE_BOUNDS
        sync: false
      - key: ONFLOWS_ATHLETE_TIMEZONE
        sync: false
      - key: ONFLOWS_INTRAZONE_VERSION
        value: intra_zone_linear_v1
      - key: ONFLOWS_TREF_VERSION
        value: tref-fixed-expert-v1
      - key: ONFLOWS_RECOVERY_VERSION
        sync: false
      - key: ONFLOWS_HISTORY_DAYS
        value: "90"
      - key: ONFLOWS_SNAPSHOT_SALT
        sync: false
  - type: web
    name: onflows-web-preview
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    runtime: node
    branch: codex/build-end-to-end-cloud-integration
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: ONFLOWS_DATA_MODE
        value: api
      - key: ONFLOWS_API_RESOURCE
        value: real
      - key: ONFLOWS_API_BASE_URL
        sync: false
      - key: ONFLOWS_SERVICE_TOKEN
        sync: false
