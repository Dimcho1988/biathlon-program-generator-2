name: API CI

on:
  pull_request:
    branches:
      - codex/main-real-data-model-integration
      - codex/build-end-to-end-cloud-integration

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt "pytest>=8.0,<10.0"
      - name: Verify dose and preparation regressions
        run: python -m pytest -q --tb=long tests/api/test_microcycle_complete_doses.py tests/api/test_long_term_quality_balance.py tests/api/test_long_term_scheduling.py tests/api/test_q_prescription_contract.py tests/api/test_quality_reservation_feasibility.py tests/api/test_feasible_quality_reservations.py
      - name: Run API tests
        run: python -m pytest -q tests/api

  canonical-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical dependencies
        run: python -m pip install -r requirements.txt
      - name: Run canonical tests
        run: python -m pytest -q --ignore=tests/api
