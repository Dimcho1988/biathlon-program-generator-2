name: API CI

on:
  pull_request:
    branches:
      - codex/main-real-data-model-integration

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Run API tests
        run: python -m pytest -q tests/api

  canonical-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical dependencies
        run: python -m pip install -r requirements.txt
      - name: Run canonical tests
        run: python -m pytest -q --ignore=tests/api
